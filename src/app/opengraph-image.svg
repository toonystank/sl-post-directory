<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="airmail" width="44" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="16" height="16" fill="#B4161B" />
      <rect x="16" width="8" height="16" fill="#FBF7EF" />
      <rect x="24" width="16" height="16" fill="#F5B700" />
      <rect x="40" width="4" height="16" fill="#FBF7EF" />
    </pattern>
  </defs>

  <!-- Warm Day Post paper canvas -->
  <rect width="1200" height="630" fill="#FBF7EF" />

  <!-- Outer card with ink shadow -->
  <rect x="64" y="64" width="1080" height="510" rx="12" fill="#1A1714" />
  <rect x="56" y="56" width="1080" height="510" rx="12" fill="#FFFDF8" stroke="#1A1714" stroke-width="5" />

  <!-- Top airmail stripe -->
  <rect x="59" y="59" width="1074" height="16" fill="url(#airmail)" />

  <!-- Large perforated StampMark -->
  <g transform="translate(120, 165) scale(6.2)">
    <rect width="40" height="40" rx="2" fill="#B4161B" />
    <rect x="4.5" y="4.5" width="31" height="31" fill="none" stroke="#FAF5EC" stroke-opacity="0.65" stroke-width="0.9" />
    <rect x="10" y="14" width="20" height="13" rx="1" fill="none" stroke="#FAF5EC" stroke-width="1.9" />
    <path d="M10.5 14.8 L20 21.5 L29.5 14.8" fill="none" stroke="#FAF5EC" stroke-width="1.9" stroke-linejoin="round" />
    <path d="M7 31 C13 30 17 28 21 25" fill="none" stroke="#F5B700" stroke-width="2" stroke-linecap="round" />
    <!-- Perforation notches against #FFFDF8 card -->
    <g fill="#FFFDF8">
      <circle cx="2" cy="0" r="1.6" /><circle cx="6" cy="0" r="1.6" /><circle cx="10" cy="0" r="1.6" /><circle cx="14" cy="0" r="1.6" /><circle cx="18" cy="0" r="1.6" /><circle cx="22" cy="0" r="1.6" /><circle cx="26" cy="0" r="1.6" /><circle cx="30" cy="0" r="1.6" /><circle cx="34" cy="0" r="1.6" /><circle cx="38" cy="0" r="1.6" />
      <circle cx="2" cy="40" r="1.6" /><circle cx="6" cy="40" r="1.6" /><circle cx="10" cy="40" r="1.6" /><circle cx="14" cy="40" r="1.6" /><circle cx="18" cy="40" r="1.6" /><circle cx="22" cy="40" r="1.6" /><circle cx="26" cy="40" r="1.6" /><circle cx="30" cy="40" r="1.6" /><circle cx="34" cy="40" r="1.6" /><circle cx="38" cy="40" r="1.6" />
      <circle cx="0" cy="2" r="1.6" /><circle cx="0" cy="6" r="1.6" /><circle cx="0" cy="10" r="1.6" /><circle cx="0" cy="14" r="1.6" /><circle cx="0" cy="18" r="1.6" /><circle cx="0" cy="22" r="1.6" /><circle cx="0" cy="26" r="1.6" /><circle cx="0" cy="30" r="1.6" /><circle cx="0" cy="34" r="1.6" /><circle cx="0" cy="38" r="1.6" />
      <circle cx="40" cy="2" r="1.6" /><circle cx="40" cy="6" r="1.6" /><circle cx="40" cy="10" r="1.6" /><circle cx="40" cy="14" r="1.6" /><circle cx="40" cy="18" r="1.6" /><circle cx="40" cy="22" r="1.6" /><circle cx="40" cy="26" r="1.6" /><circle cx="40" cy="30" r="1.6" /><circle cx="40" cy="34" r="1.6" /><circle cx="40" cy="38" r="1.6" />
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(425, 210)">
    <rect x="0" y="-42" width="290" height="32" rx="4" fill="#F5B700" stroke="#1A1714" stroke-width="2" />
    <text x="14" y="-20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#1A1714" letter-spacing="1.5">POSTCODES · HOURS · RATES</text>

    <text y="52" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="68" font-weight="900" fill="#1A1714" letter-spacing="-1.5">Lanka Post</text>
    <text y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="68" font-weight="900" fill="#B4161B" letter-spacing="-1.5">Directory</text>
    <text y="186" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="500" fill="#6B6158">Every post office, postal code, and official tariff in Sri Lanka.</text>
  </g>
</svg>
